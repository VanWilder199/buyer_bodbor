# WEB-11: прод-конфиг nginx для apps/web.
# Служит рядом с API: фронт на :80, /api/* проксируется на сервис `api:8080`.
# Содержимое http-контекста (map) — conf.d включается внутрь http {}.

# S-10: не логируем query-string для страниц отчёта (в ней токен).
map $request_uri $request_uri_safe {
    ~^/reports/view          $uri;
    ~^/api/reports/view      $uri;
    default                  $request_uri;
}

log_format main_uri '$remote_addr - $remote_user [$time_local] '
                    '"$request_method $request_uri_safe $server_protocol" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent"';

server {
    listen 80;
    server_name _;

    access_log /var/log/nginx/access.log main_uri;
    error_log  /var/log/nginx/error.log warn;

    # --- Заголовки безопасности ---
    # <s3-host> заменить на реальный хост S3 с фото/видео отчётов.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' https://<s3-host> data:; media-src https://<s3-host>; connect-src 'self'; frame-ancestors 'none'" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;

    # --- API: префикс /api срезается, дальше уходит на бэкенд ---
    location /api/ {
        proxy_pass http://api:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Ассеты: долгий кеш (хешированные имена файлов) ---
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # --- index.html без кеша ---
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # --- SPA-фолбэк: все маршруты отдают index.html ---
    location / {
        try_files $uri /index.html;
    }
}